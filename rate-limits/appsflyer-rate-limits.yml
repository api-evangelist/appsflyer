limit_count: 11
model: 'AppsFlyer does not run one global throttle. It runs two different mechanisms: a report-generation
  QUOTA counted per report type, per app and per account per calendar day (Pull API and the export pages),
  and conventional per-second/per-minute rate limits on the transactional APIs (OneLink, Cohort, SKAN,
  OpenDSR). Quotas reset at 00:00 UTC. Advertiser quotas vary by subscription plan and are not fully published.'
headers:
  published: false
  x_ratelimit: false
  ratelimit_rfc9331: false
  retry_after: false
  note: 'This is the significant gap for an agent. AppsFlyer declares NO rate-limit response headers anywhere
    — not in any of the 36 harvested OpenAPI documents and not in the Help Center. A client cannot read
    its remaining budget from a response; it can only observe the 429 after the fact. The one machine-readable
    budget signal AppsFlyer publishes is a dedicated endpoint, not a header: GET /shortlinks-quota/{account-id}
    on the OneLink API (operationId get-onelink-v2-link-quota) returns {"remaining_api_calls": <int>},
    and it is badged Premium.'
  quota_endpoint:
    api: OneLink API v2.0
    operationId: get-onelink-v2-link-quota
    path: /shortlinks-quota/{account-id}
    returns: remaining_api_calls
    entitlement: Premium
