separation_rules:
- Quotas are counted separately per reporting tool — the Pull API and the raw-data export page each get
  their own budget for the same report.
- Quotas are counted separately per report type.
- Agencies and advertisers hold separate Pull API quotas; agency-generated reports do not count against
  the advertiser quota, UNLESS the agency authenticates with the advertiser's own API token, in which
  case the calls are indistinguishable and are charged to the advertiser.
- Ad-network-generated reports never count against the advertiser quota.
