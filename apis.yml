- name: Click Signing API (Protect360)
  description: The Protect360 click-signing API manages the secret keys, configuration, excluded apps,
    circuit breaker and reporting used to cryptographically sign attribution clicks so AppsFlyer can reject
    unsigned or forged click traffic as part of its mobile ad-fraud protection suite.
  humanURL: https://dev.appsflyer.com/hc/reference/api-reference-overview
