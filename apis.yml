- name: Pull API (Reporting Data)
  description: 'Report-pull endpoints that export AppsFlyer attribution and analytics data as CSV/JSON:
    raw-data installs, in-app events, re-engagements, retargeting, uninstalls, ad-revenue and protect360
    reports (V1 and V2 token variants), the aggregate performance reports (partners, geo, daily, GEO-by-date),
    the Master API wide aggregate report and its freshness endpoint, and the Cohort API. Authenticated
    with an API V2 token (JWT) as an Authorization: Bearer header.'
  humanURL: https://dev.appsflyer.com/hc/reference/api-reference-overview
