apis:
- name: Creative External API
  description: >-
    The Creative External API uploads creative assets and publishes ads to ad networks programmatically,
    bypassing the AppsFlyer Creative Dashboard UI. It is asynchronous — a batch is submitted for upload
    and publication and returns a batch identifier, then per-item processing status and results are polled
    separately (AppsFlyer recommends starting at a 5-second poll interval with exponential backoff capped
    at 60 seconds). Facebook (Meta) is the currently supported destination network. Authenticated with
    the account API V2 token as a bearer token.
  humanURL: https://dev.appsflyer.com/hc/reference/creative-external-api-overview
  baseURL: https://hq1.appsflyer.com/creative-dashboard/api
  tags:
  - Creatives
  - ad-networks
  - Creative Management
  - Advertising
  - Asynchronous
  - Meta
  tags_raw:
  - creatives
  - ad-networks
  - creative-management
  - advertising
  - asynchronous
  - meta
  properties:
  - type: Documentation
    url: https://dev.appsflyer.com/hc/reference/creative-external-api-overview
  - type: APIReference
    url: https://dev.appsflyer.com/hc/reference
  - type: Authentication
    url: authentication/appsflyer-authentication.yml
  - type: Conventions
    url: conventions/appsflyer-conventions.yml
  x-no-openapi: >-
    AppsFlyer documents this API as a narrative guide page only. Unlike the other 36 APIs in this profile
    it has no OAS-backed reference pages in the developer hub, so there is no published OpenAPI to harvest.
    The two operations are POST /creative/v1.0/upload/batch and GET /creative/v1.0/upload/status/{batch_id}.
- name: AppsFlyer MCP Server
  description: >-
    AppsFlyer's hosted Model Context Protocol server exposes AppsFlyer's unified marketing data to LLM
    clients and agents over an OAuth 2.1 authorization-code + PKCE flow with dynamic client registration,
    covering campaign performance and ROAS, SKAN and SSOT metrics, audience lists and deployment status,
    OneLink configurations, app settings and SDK integration details, and the AppsFlyer Help Center corpus.
  humanURL: https://www.appsflyer.com/products/agentic-ai/mcp/
  baseURL: https://mcp.appsflyer.com/
  tags:
  - MCP
  - Agentic AI
  - LLM
  - agent-native
  - Marketing Analytics
