  x-no-openapi: 'AppsFlyer documents this API as a narrative guide page only. Unlike the other 36 APIs
    in this profile it has no OAS-backed reference pages in the developer hub, so there is no published
    OpenAPI to harvest. The two operations are POST /creative/v1.0/upload/batch and GET /creative/v1.0/upload/status/{batch_id}.'
- name: AppsFlyer MCP Server
  description: AppsFlyer's hosted Model Context Protocol server exposes AppsFlyer's unified marketing
    data to LLM clients and agents over an OAuth 2.1 authorization-code + PKCE flow with dynamic client
    registration, covering campaign performance and ROAS, SKAN and SSOT metrics, audience lists and deployment
    status, OneLink configurations, app settings and SDK integration details, and the AppsFlyer Help Center
    corpus.
  humanURL: https://www.appsflyer.com/products/agentic-ai/mcp/
