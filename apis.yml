- name: OpenDSR API
  description: The OpenDSR (Data Subject Request) API implements the IAB OpenDSR specification so advertisers
    can submit, track, and cancel GDPR/CCPA subject access and erasure requests against AppsFlyer on behalf
    of their users, including stub requests for testing and status polling for submitted requests.
