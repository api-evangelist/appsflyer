- name: Events APIs (Server-to-Server & Client-to-Server)
  description: Event-ingestion endpoints for sending installs, sessions and in-app events to AppsFlyer
    from a server or a non-mobile client. Covers the mobile S2S events API (api3), the legacy mobile S2S
    API (api2), the Web S2S API, the PC/Console/CTV S2S and client-app events APIs (both with dedicated
    sandbox hosts), the Engagements API for click and impression engagements, the deep-linking REST API,
    and the preload measurement S2S/C2S APIs.
