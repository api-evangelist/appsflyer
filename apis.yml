aid: appsflyer
name: AppsFlyer
description: 'AppsFlyer is a mobile marketing analytics and attribution platform used by app marketers
  to measure, attribute and optimize user acquisition across mobile, web, CTV, console and PC. Its developer
  surface spans mobile and platform SDKs (iOS, Android, Unity, React Native, Flutter, Cordova, Unreal,
  Roku, Tizen, webOS) and a large REST API estate published on the AppsFlyer developer hub: Pull APIs
  for raw and aggregate report export, the Master and Cohort reporting APIs, server-to-server and client-to-server
  event ingestion APIs, the OneLink deep-linking API, audience import/activation APIs, SKAdNetwork conversion-value
  and postback APIs, app and user management APIs, the Protect360 click-signing anti-fraud API, the ROI360
  net-revenue API, and an OpenDSR privacy-request API. AppsFlyer also runs a Push API webhook surface
  for real-time postbacks and a hosted Model Context Protocol (MCP) server for agent access.'
