authentication:
  primary: 'API V2 token (JWT) sent as Authorization: Bearer <token>'
  issued_from: AppsFlyer dashboard Security Center (admin only)
  rotation: Displayed once at creation and never retrievable again; max two API tokens per token type per account.
  revocation_event: All API V2 tokens generated before 2026-03-10 19:00 UTC were revoked and had to be regenerated.
  other_schemes:
  - name: api_token query parameter
    used_by: Pull API V1 token endpoints
    note: Legacy; superseded by the V2 bearer token.
  - name: authentication header (Dev Key)
    used_by: Server-to-server events API for mobile (api3/api2)
    note: The app Dev Key, taken from App Settings.
  - name: authorization header (OneLink / CTV token)
    used_by: OneLink API, PC/Console/CTV events, preload measurement
    note: A per-product API token, not the account V2 token.
  artifact: authentication/appsflyer-authentication.yml
idempotency:
  supported: false
  note: No idempotency-key header or parameter appears in any of the 141 harvested operations, and the docs do not
    document one. Event ingestion instead relies on caller-supplied event identifiers and AppsFlyer-side deduplication
    windows.
pagination:
  style: offset-limit
  params:
  - name: limit
    in: query
  - name: offset
    in: query
  note: 'Used by the App list API (up to 1,000 records per page) and the audit-log API. Report-pull endpoints are
    not paginated: they stream a whole report (raw-data Pull API returns up to 1,000,000 rows per request) and use
    maximum_rows / date-window parameters instead.'
  docs: https://support.appsflyer.com/hc/en-us/articles/360011999877-App-list-API-for-app-owners
versioning:
  scheme: uri-path
  note: Version is carried in the path or the report name — /api/app/v2.0, /api/p360-click-signing/v2.0, /api/net-revenue/v2.0/,
    /export/{app-id}/installs_report/v5, /api/skadnetworks/v3. Older majors run alongside newer ones (SKAN v2 +
    v3, Pull API V1 token + V2 token).
  artifact: lifecycle/appsflyer-lifecycle.yml
request_tracing:
  field: request_id
  location: error response body
  note: A UUID returned on error payloads; quote it when opening a support ticket.
