rate_limiting:
  signal: HTTP 429 on 17 operations across 8 specs
  headers: None declared in the specs — no X-RateLimit-*, RateLimit-* or Retry-After header is documented
    on any operation.
  budget_endpoint: 'GET /shortlinks-quota/{account-id} (OneLink API, operationId get-onelink-v2-link-quota)
    returns {remaining_api_calls}. It is the only machine-readable rate budget AppsFlyer exposes, it covers
    only OneLink, and it is badged Premium.'
  model: 'Two mechanisms, not one: per-calendar-day report-generation quotas counted per report type,
    per app and per account (reset 00:00 UTC), plus conventional per-second/per-minute limits on the transactional
    APIs. Published figures include OneLink at 7,500,000 requests/month and 500 requests/second per account,
    Cohort API at 60 calls/minute per account, SKAN aggregate at 10 calls/minute per account, Master API
    unlimited, and OpenDSR at 350 requests/minute (~504,000/day).'
  artifact: rate-limits/appsflyer-rate-limits.yml
