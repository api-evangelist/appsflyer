      summary: Reasoning-search
      description: Search reasoning history for a specific agent run. Retrieves the most relevant trace chunks (reasoning steps, tool calls, tool outputs) that match the question via semantic search. Use the returned chunks to understand *why* the agent made specific decisions during execution. **Return format (JSO...
