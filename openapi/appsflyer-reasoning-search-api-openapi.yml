        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad Request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                run_id:
                  description: UUID of the agent run to search (e.g. '3fa85f64-5717-4562-b3fc-2c963f66afa6')
                  format: uuid
                  type: string
                question:
                  description: Natural-language question about the agent run, e.g. 'Why did the campaign fail to install?'
                  maxLength: 2000
                  minLength: 1
                  type: string
                top_k:
                  default: 5
                  description: Maximum number of reasoning chunks to return. Higher values give more context but slower responses.
                  maximum: 50
                  minimum: 1
                  type: integer
