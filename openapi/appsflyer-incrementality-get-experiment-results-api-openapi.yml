                  type: boolean
                include_geo_breakdown:
                  default: false
                  description: Set true to also attach, per cell, the geo_breakdown (holdout_regions, exposure_regions, geo_policies). This makes an additional backend call, so leave false unless the user asks about geo assignment, test/control regions.
                  title: Include Geo Breakdown
                  type: boolean
              required:
