      description: 'Get geo-experiment results for one Incrementality for UA experiment. Returns the measured incremental impact of the campaign: lift, incremental installs/in-app events, cost per incremental action, Incremental Factor, estimated incremental revenue and ROAS, and the credible interval. Call `list_ex...'
