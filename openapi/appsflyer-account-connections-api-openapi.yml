openapi: 3.2.0
info:
  title: Audience External Account connections API
  version: 1.0.0
servers:
- url: https://hq1.appsflyer.com/api/audiences-external-api
security:
- bearerAuth: []
tags:
- name: Account connections
paths:
  /connections:
    get:
      tags:
      - Account connections
      summary: List partner connections for account
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                required:
                - message
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      connections:
                        $ref: '#/components/schemas/integrations_response'
      operationId: getConnections
      x-operation-id-source: derived
components:
  schemas:
    integration_name:
      type: string
      example: Integration 123
    integration_id:
      type: integer
      example: 1234
    partner_id:
      type: string
      example: amazon_int
    integrations_response:
      type: array
      items:
        required:
        - integration_id
        - integration_name
        - partner_id
        type: object
        properties:
          integration_id:
            $ref: '#/components/schemas/integration_id'
          partner_id:
            $ref: '#/components/schemas/partner_id'
          integration_name:
            $ref: '#/components/schemas/integration_name'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-id:
- reitit.swagger/default
