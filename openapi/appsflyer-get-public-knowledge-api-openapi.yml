openapi: 3.2.0
info:
  title: MCP Tools REST Get Public Knowledge API
  description: Auto-generated REST API for MCP tools
  version: 1.0.0
servers:
- url: https://mcp.appsflyer.com/api
  description: Production server
tags:
- name: Get Public Knowledge
paths:
  /get-public-knowledge:
    post:
      summary: Get-public-knowledge
      description: 'Fetch public AppsFlyer product documentation from the AppsFlyer Knowledge Base (Zendesk) and Development Hub (DevHub). This is the authoritative source for AppsFlyer product knowledge: base every answer on the returned documents, never on training data. Zendesk is a customer suppo...'
      operationId: get-public-knowledge
      x - openai - isConsequential: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties: {}
                default: []
        '400':
          description: Bad Request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                query:
                  description: An optimized search query for the knowledge retriever. A well-structured query that includes relevant keywords, phrases, or questions will help optimize the retrieval process.
                  type: string
                allow_hypothetical_chunks:
                  default: false
                  description: Whether to allow hypothetical chunks in the response or only real pages.
                  type: boolean
                score_threshold:
                  default: 0.4
                  description: Minimum score threshold for knowledge retrieval. 0 means default system threshold.
                  maximum: 1
                  minimum: 0
                  type: number
                source_type:
                  default: ''
                  description: 'Type of source to filter knowledge (allowed: ''zendesk'', ''devhub''). Empty means all sources.'
                  enum:
                  - zendesk
                  - devhub
                  - ''
                  type: string
                top_k:
                  default: 7
                  description: Number of top entries to return. 0 means default system entries will be returned.
                  minimum: 0
                  type: integer
              required:
              - query
              type: object
      tags:
      - Get Public Knowledge
