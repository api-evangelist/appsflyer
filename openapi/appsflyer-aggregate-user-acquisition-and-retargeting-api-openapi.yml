        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - ApiKeyAuth: []
    servers:
    - url: https://hq.appsflyer.com/export/
  /{app-id}/partners_by_date_report/v5:
    get:
      deprecated: false
      tags:
