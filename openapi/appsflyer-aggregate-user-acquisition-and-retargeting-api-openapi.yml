      summary: Partners
      description: "Data is grouped by media source and campaign. \nData type: LTV \nFor details, see [KB link](https://support.appsflyer.com/hc/en-us/articles/360007530258-Using-Pull-API-raw-data)\n"
      parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/ToDate'
      - $ref: '#/components/parameters/MediaSource'
      - $ref: '#/components/parameters/Category'
