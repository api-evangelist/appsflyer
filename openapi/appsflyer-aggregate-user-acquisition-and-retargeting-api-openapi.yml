openapi: 3.2.0
info:
  title: Appsflyer Aggregate (user acquisition and retargeting) API
  version: 1.0.0
  description: 'Operations tagged Aggregate (user acquisition and retargeting) across 2 of this provider''s published API definitions: appsflyer-aggregate-pull-api-v1-token-openapi.yml, appsflyer-aggregate-pull-api-v2-token-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://hq.appsflyer.com/export/
- url: https://hq1.appsflyer.com/api/agg-data/export/app/
tags:
- name: Aggregate (user acquisition and retargeting)
paths:
  /{app-id}/daily_report/v5:
    get:
      deprecated: false
      tags:
      - Aggregate (user acquisition and retargeting)
      summary: Daily
      description: "Data is grouped by date, media source, and campaign, and excludes in-app events. \nData type: LTV\n"
      parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/ToDate'
      - $ref: '#/components/parameters/MediaSource'
      - $ref: '#/components/parameters/Category'
      - $ref: '#/components/parameters/AttributionTouchType'
      - $ref: '#/components/parameters/Currency'
      - $ref: '#/components/parameters/ReAttribution'
      - $ref: '#/components/parameters/TimeZone'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - ApiKeyAuth: []
    servers:
    - url: https://hq.appsflyer.com/export/
  /{app-id}/geo_by_date_report/v5:
    get:
      deprecated: false
      tags:
      - Aggregate (user acquisition and retargeting)
      summary: Geo daily
      description: "Data is grouped by date, geo, media source, and campaign. \nData type: LTV\n"
      parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/ToDate'
      - $ref: '#/components/parameters/MediaSource'
      - $ref: '#/components/parameters/Category'
      - $ref: '#/components/parameters/AttributionTouchType'
      - $ref: '#/components/parameters/Currency'
      - $ref: '#/components/parameters/ReAttribution'
      - $ref: '#/components/parameters/TimeZone'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - ApiKeyAuth: []
    servers:
    - url: https://hq.appsflyer.com/export/
  /{app-id}/geo_report/v5:
    get:
      deprecated: false
      tags:
      - Aggregate (user acquisition and retargeting)
      summary: Geo
      description: 'Data is grouped by geo, media source, and campaign.

        Data type: LTV

        '
      parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/ToDate'
      - $ref: '#/components/parameters/MediaSource'
      - $ref: '#/components/parameters/Category'
