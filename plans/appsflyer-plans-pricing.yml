- 'Raw Data API Access is an explicitly named premium add-on, not a baseline entitlement: the Pull API
  surface is gated behind it after the 30-day trial.'
- Several OneLink API operations are tagged "Premium" in AppsFlyer's own published OpenAPI (for example
  operationId get-onelink-v2-link-quota and onelink-v2-create-link carry a "Premium" badge in the operation
