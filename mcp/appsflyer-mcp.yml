    description: Generates iOS Swift code instructions for logging an in-app event with AppsFlyer.
  - name: fetchAppsflyerLogs
    category: log-analysis
    description: Fetches recent Android logcat logs related to AppsFlyer.
  - name: getConversionLogs
    category: log-analysis
    description: Extracts Android conversion/install event logs from logcat.
  - name: getInAppLogs
    category: log-analysis
